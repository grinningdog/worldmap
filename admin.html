ht:44px}}

};const STATUS_OPTIONS=[{value:'default',text:'Unvisited (Grey)'},{value:'visited',text:'Visited (Green)'},{value:'priority_a',text:'Priority A (Dark Blue)'},{value:'priority_b',text:'Priority B (Medium Blue)'},{value:'priority_c',text:'Priority C (Light Blue)'},{value:'never',text:'Will Never Visit (Red)'}];let travelData={countries:{}};
function initialiseDefaults(){travelData={countries:{}};Object.keys(COUNTRIES).forEach(code=>travelData.countries[code]='default')}
function normaliseData(data){if(!data||!data.countries)throw new Error('Invalid JSON: expected a countries object.');const out={countries:{}};Object.keys(COUNTRIES).forEach(code=>{const v=data.countries[code];out.countries[code]=STATUS_OPTIONS.some(o=>o.value===v)?v:'default'});return out}
function init(){const saved=localStorage.getItem('travelMapData');if(saved){try{travelData=normaliseData(JSON.parse(saved))}catch(e){initialiseDefaults()}}else initialiseDefaults();renderList();updateStatusMessage()}
function renderList(){const tbody=document.getElementById('countryList');tbody.innerHTML='';Object.entries(COUNTRIES).forEach(([code,name])=>{const row=document.createElement('tr');row.dataset.name=name.toLowerCase();const a=document.createElement('td');a.textContent=name;const b=document.createElement('td');const c=document.createElement('code');c.textContent=code;b.appendChild(c);const d=document.createElement('td');const s=document.createElement('select');STATUS_OPTIONS.forEach(o=>{const x=document.createElement('option');x.value=o.value;x.textContent=o.text;if(travelData.countries[code]===o.value)x.selected=true;s.appendChild(x)});s.onchange=()=>updateStatus(code,s.value);d.appendChild(s);row.append(a,b,d);tbody.appendChild(row)})}
function updateStatus(code,value){travelData.countries[code]=value;updateStatusMessage()}
function updateStatusMessage(){const c={};Object.values(travelData.countries).forEach(s=>c[s]=(c[s]||0)+1);document.getElementById('statusMessage').textContent='Countries: '+Object.keys(COUNTRIES).length+' | Visited: '+(c.visited||0)+' | Priority: '+((c.priority_a||0)+(c.priority_b||0)+(c.priority_c||0))+' | Never visit: '+(c.never||0)}
function saveLocal(){localStorage.setItem('travelMapData',JSON.stringify(travelData));alert('Saved to this browser. Export the JSON and replace data.json on GitHub to update the public map.')}
function exportJSON(){document.getElementById('jsonOutput').value=JSON.stringify(travelData,null,2);document.getElementById('exportModal').style.display='flex'}async function copyJSON(){const t=document.getElementById('jsonOutput');try{await navigator.clipboard.writeText(t.value)}catch(e){t.select();document.execCommand('copy')}alert('Copied! Replace data.json on GitHub with this content.')}function closeModal(){document.getElementById('exportModal').style.display='none'}
function importJSON(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{travelData=normaliseData(JSON.parse(e.target.result));localStorage.setItem('travelMapData',JSON.stringify(travelData));renderList();updateStatusMessage();alert('Data imported successfully.')}catch(err){alert('Error: '+err.message)}};reader.readAsText(file);event.target.value=''}function resetData(){if(!confirm('Reset every country to Unvisited (Grey)?'))return;initialiseDefaults();saveLocal();renderList();updateStatusMessage()}function filterCountries(){const q=document.getElementById('searchInput').value.toLowerCase();document.querySelectorAll('#countryList tr').forEach(r=>r.style.display=r.dataset.name.includes(q)?'':'none')}init();
