<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Travel Map Admin</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f4f7f6;color:#333}
header{background:#2c3e50;color:#fff;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:1.5rem}header a{color:#fff;text-decoration:none;font-weight:bold}
.container{max-width:1200px;margin:0 auto;padding:1.25rem}
.actions{background:#fff;padding:1rem;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,.07);margin-bottom:1rem;display:flex;gap:.65rem;flex-wrap:wrap}.actions button{flex:1 1 150px}
button{padding:.7rem 1rem;border:0;border-radius:6px;cursor:pointer;font-weight:700;font-size:.92rem;min-height:44px}.btn-primary{background:#3498db;color:#fff}.btn-success{background:#2ECC71;color:#fff}.btn-warning{background:#f39c12;color:#fff}.btn-danger{background:#e74c3c;color:#fff}.btn-neutral{background:#ecf0f1;color:#333}
.search-box{width:100%;padding:.8rem 1rem;margin-bottom:1rem;border:1px solid #d8dde0;border-radius:7px;font-size:1rem;background:#fff}.status{background:#fff;padding:.75rem 1rem;border-radius:7px;margin-bottom:1rem;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.source{background:#eef7ff;border:1px solid #cfe7fa;padding:.8rem 1rem;border-radius:7px;margin-bottom:1rem;font-size:.92rem}.source strong{display:block;margin-bottom:.2rem}.muted{color:#68757d;font-size:.85rem}
.country-list{background:#fff;border-radius:9px;box-shadow:0 2px 5px rgba(0,0,0,.06);overflow:hidden}.country-row{display:grid;grid-template-columns:minmax(220px,1fr) 70px minmax(260px,330px);align-items:center;gap:1rem;padding:.65rem 1rem;border-bottom:1px solid #eee}.country-row:last-child{border-bottom:0}.country-row.header{font-weight:700;background:#f8f9fa;position:sticky;top:0;z-index:2}.country-code{font-family:monospace;color:#68757d}.country-row select{width:100%;padding:.55rem;border-radius:5px;border:1px solid #d5dadd;font-size:.95rem;background:#fff;min-height:42px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:center;padding:1rem}.modal{background:#fff;padding:1.25rem;border-radius:10px;width:min(900px,100%);height:min(88vh,800px);display:flex;flex-direction:column}.modal h2{margin:.1rem 0 .4rem}.modal p{margin:.2rem 0;color:#555}.modal textarea{flex:1;min-height:200px;width:100%;box-sizing:border-box;font-family:ui-monospace,SFMono-Regular,monospace;font-size:.9rem;padding:1rem;border:1px solid #ddd;border-radius:6px;margin:1rem 0;resize:none}.modal-actions{display:flex;gap:.6rem;flex-wrap:wrap}.modal-actions button{flex:1}
input[type=file]{display:none}
@media(max-width:768px){header{padding:.75rem 1rem}header h1{font-size:1.15rem}header a{font-size:.9rem}.container{padding:.75rem}.actions{padding:.75rem;display:grid;grid-template-columns:1fr 1fr;gap:.55rem}.actions button{width:100%;font-size:.86rem;padding:.6rem .45rem}.source{font-size:.85rem}.country-list{background:transparent;box-shadow:none;overflow:visible}.country-row.header{display:none}.country-row{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:.55rem;padding:.7rem;grid-template-columns:1fr auto;gap:.25rem .65rem}.country-name{font-weight:700}.country-code{grid-column:2;grid-row:1;font-size:.8rem}.country-row select{grid-column:1 / -1;font-size:.95rem}.modal{height:92vh;padding:.9rem}.modal textarea{font-size:.78rem;margin:.75rem 0}.modal-actions{display:grid;grid-template-columns:1fr 1fr}.modal-actions button{width:100%}}
@media(min-width:769px){.country-list{max-height:calc(100vh - 290px);overflow:auto}}
</style>
</head>
<body>
<header><h1>⚙️ Travel Map Admin</h1><a href="index.html">View Map</a></header>
<div class="container">
 <div class="actions">
  <button class="btn-primary" onclick="loadFromGitHub()">🔄 Load from GitHub</button>
  <button class="btn-success" onclick="openJSONEditor('export')">📤 Export JSON</button>
  <button class="btn-warning" onclick="openJSONEditor('import')">📥 Import / Edit JSON</button>
  <button class="btn-neutral" onclick="saveDraft()">💾 Save Draft</button>
  <button class="btn-danger" onclick="resetData()">↺ Reset All</button>
 </div>
 <div class="source"><strong id="sourceTitle">Data source: GitHub</strong><span id="sourceText">Loading the current data.json from this site…</span></div>
 <div class="status" id="statusMessage"></div>
 <input type="text" class="search-box" id="searchInput" oninput="filterCountries()" placeholder="Search for a country…">
 <div class="country-list" id="countryList"></div>
</div>
<div class="modal-bg" id="jsonModal"><div class="modal"><h2 id="modalTitle">JSON</h2><p id="modalHelp"></p><textarea id="jsonEditor" spellcheck="false"></textarea><div class="modal-actions"><button class="btn-primary" onclick="copyJSON()">Copy</button><button class="btn-success" id="applyJSONButton" onclick="applyJSON()">Use This JSON</button><button class="btn-neutral" onclick="closeJSONEditor()">Close</button></div></div></div>
<script>
const COUNTRIES={
"AF":"Afghanistan","AL":"Albania","DZ":"Algeria","AS":"American Samoa","AD":"Andorra","AO":"Angola","AI":"Anguilla","AQ":"Antarctica","AG":"Antigua and Barbuda","AR":"Argentina","AM":"Armenia","AW":"Aruba","AU":"Australia","AT":"Austria","AZ":"Azerbaijan","BS":"Bahamas","BH":"Bahrain","BD":"Bangladesh","BB":"Barbados","BY":"Belarus","BE":"Belgium","BZ":"Belize","BJ":"Benin","BM":"Bermuda","BT":"Bhutan","BO":"Bolivia, Plurinational State of","BQ":"Bonaire, Sint Eustatius and Saba","BA":"Bosnia and Herzegovina","BW":"Botswana","BV":"Bouvet Island","BR":"Brazil","IO":"British Indian Ocean Territory","BN":"Brunei Darussalam","BG":"Bulgaria","BF":"Burkina Faso","BI":"Burundi","CV":"Cabo Verde","KH":"Cambodia","CM":"Cameroon","CA":"Canada","KY":"Cayman Islands","CF":"Central African Republic","TD":"Chad","CL":"Chile","CN":"China","CX":"Christmas Island","CC":"Cocos (Keeling) Islands","CO":"Colombia","KM":"Comoros","CG":"Congo","CD":"Congo, The Democratic Republic of the","CK":"Cook Islands","CR":"Costa Rica","HR":"Croatia","CU":"Cuba","CW":"Curaçao","CY":"Cyprus","CZ":"Czechia","CI":"Côte d'Ivoire","DK":"Denmark","DJ":"Djibouti","DM":"Dominica","DO":"Dominican Republic","EC":"Ecuador","EG":"Egypt","SV":"El Salvador","GQ":"Equatorial Guinea","ER":"Eritrea","EE":"Estonia","SZ":"Eswatini","ET":"Ethiopia","FK":"Falkland Islands (Malvinas)","FO":"Faroe Islands","FJ":"Fiji","FI":"Finland","FR":"France","GF":"French Guiana","PF":"French Polynesia","TF":"French Southern Territories","GA":"Gabon","GM":"Gambia","GE":"Georgia","DE":"Germany","GH":"Ghana","GI":"Gibraltar","GR":"Greece","GL":"Greenland","GD":"Grenada","GP":"Guadeloupe","GU":"Guam","GT":"Guatemala","GG":"Guernsey","GN":"Guinea","GW":"Guinea-Bissau","GY":"Guyana","HT":"Haiti","HM":"Heard Island and McDonald Islands","VA":"Holy See (Vatican City State)","HN":"Honduras","HK":"Hong Kong","HU":"Hungary","IS":"Iceland","IN":"India","ID":"Indonesia","IR":"Iran, Islamic Republic of","IQ":"Iraq","IE":"Ireland","IM":"Isle of Man","IL":"Israel","IT":"Italy","JM":"Jamaica","JP":"Japan","JE":"Jersey","JO":"Jordan","KZ":"Kazakhstan","KE":"Kenya","KI":"Kiribati","KP":"Korea, Democratic People's Republic of","KR":"Korea, Republic of","XK":"Kosovo","KW":"Kuwait","KG":"Kyrgyzstan","LA":"Lao People's Democratic Republic","LV":"Latvia","LB":"Lebanon","LS":"Lesotho","LR":"Liberia","LY":"Libya","LI":"Liechtenstein","LT":"Lithuania","LU":"Luxembourg","MO":"Macao","MG":"Madagascar","MW":"Malawi","MY":"Malaysia","MV":"Maldives","ML":"Mali","MT":"Malta","MH":"Marshall Islands","MQ":"Martinique","MR":"Mauritania","MU":"Mauritius","YT":"Mayotte","MX":"Mexico","FM":"Micronesia, Federated States of","MD":"Moldova, Republic of","MC":"Monaco","MN":"Mongolia","ME":"Montenegro","MS":"Montserrat","MA":"Morocco","MZ":"Mozambique","MM":"Myanmar","NA":"Namibia","NR":"Nauru","NP":"Nepal","NL":"Netherlands","NC":"New Caledonia","NZ":"New Zealand","NI":"Nicaragua","NE":"Niger","NG":"Nigeria","NU":"Niue","NF":"Norfolk Island","MK":"North Macedonia","MP":"Northern Mariana Islands","NO":"Norway","OM":"Oman","PK":"Pakistan","PW":"Palau","PS":"Palestine, State of","PA":"Panama","PG":"Papua New Guinea","PY":"Paraguay","PE":"Peru","PH":"Philippines","PN":"Pitcairn","PL":"Poland","PT":"Portugal","PR":"Puerto Rico","QA":"Qatar","RO":"Romania","RU":"Russian Federation","RW":"Rwanda","RE":"Réunion","BL":"Saint Barthélemy","SH":"Saint Helena, Ascension and Tristan da Cunha","KN":"Saint Kitts and Nevis","LC":"Saint Lucia","MF":"Saint Martin (French part)","PM":"Saint Pierre and Miquelon","VC":"Saint Vincent and the Grenadines","WS":"Samoa","SM":"San Marino","ST":"Sao Tome and Principe","SA":"Saudi Arabia","SN":"Senegal","RS":"Serbia","SC":"Seychelles","SL":"Sierra Leone","SG":"Singapore","SX":"Sint Maarten (Dutch part)","SK":"Slovakia","SI":"Slovenia","SB":"Solomon Islands","SO":"Somalia","ZA":"South Africa","GS":"South Georgia and the South Sandwich Islands","SS":"South Sudan","ES":"Spain","LK":"Sri Lanka","SD":"Sudan","SR":"Suriname","SJ":"Svalbard and Jan Mayen","SE":"Sweden","CH":"Switzerland","SY":"Syrian Arab Republic","TW":"Taiwan, Province of China","TJ":"Tajikistan","TZ":"Tanzania, United Republic of","TH":"Thailand","TL":"Timor-Leste","TG":"Togo","TK":"Tokelau","TO":"Tonga","TT":"Trinidad and Tobago","TN":"Tunisia","TM":"Turkmenistan","TC":"Turks and Caicos Islands","TV":"Tuvalu","TR":"Türkiye","UG":"Uganda","UA":"Ukraine","AE":"United Arab Emirates","GB":"United Kingdom","US":"United States","UM":"United States Minor Outlying Islands","UY":"Uruguay","UZ":"Uzbekistan","VU":"Vanuatu","VE":"Venezuela, Bolivarian Republic of","VN":"Viet Nam","VG":"Virgin Islands, British","VI":"Virgin Islands, U.S.","WF":"Wallis and Futuna","EH":"Western Sahara","YE":"Yemen","ZM":"Zambia","ZW":"Zimbabwe","AX":"Åland Islands"};
const STATUS_OPTIONS=[{value:'default',text:'Unvisited (Grey)'},{value:'visited',text:'Visited (Green)'},{value:'priority_a',text:'Priority A (Dark Blue)'},{value:'priority_b',text:'Priority B (Medium Blue)'},{value:'priority_c',text:'Priority C (Light Blue)'},{value:'never',text:'Will Never Visit (Red)'}];
let travelData={countries:{}},jsonMode='export';
function initialiseDefaults(){travelData={countries:{}};Object.keys(COUNTRIES).forEach(c=>travelData.countries[c]='default')}
function normaliseData(data){if(!data||typeof data!=='object'||!data.countries||typeof data.countries!=='object')throw new Error('Expected JSON containing a countries object.');const out={countries:{}};Object.keys(COUNTRIES).forEach(c=>{const v=data.countries[c];out.countries[c]=STATUS_OPTIONS.some(o=>o.value===v)?v:'default'});return out}
function renderList(){const box=document.getElementById('countryList');box.innerHTML='';const h=document.createElement('div');h.className='country-row header';h.innerHTML='<div>Country</div><div>Code</div><div>Status</div>';box.appendChild(h);Object.entries(COUNTRIES).forEach(([code,name])=>{const row=document.createElement('div');row.className='country-row';row.dataset.name=name.toLowerCase();const n=document.createElement('div');n.className='country-name';n.textContent=name;const c=document.createElement('div');c.className='country-code';c.textContent=code;const d=document.createElement('div');const s=document.createElement('select');STATUS_OPTIONS.forEach(o=>{const x=document.createElement('option');x.value=o.value;x.textContent=o.text;if(travelData.countries[code]===o.value)x.selected=true;s.appendChild(x)});s.onchange=()=>{travelData.countries[code]=s.value;markDraft()};d.appendChild(s);row.append(n,c,d);box.appendChild(row)})}
function updateStatusMessage(){const c={};Object.values(travelData.countries).forEach(s=>c[s]=(c[s]||0)+1);document.getElementById('statusMessage').textContent=`Countries: ${Object.keys(COUNTRIES).length} | Visited: ${c.visited||0} | Priority: ${(c.priority_a||0)+(c.priority_b||0)+(c.priority_c||0)} | Never visit: ${c.never||0}`}
function markDraft(){updateStatusMessage();document.getElementById('sourceTitle').textContent='Data source: Edited draft';document.getElementById('sourceText').textContent='Your changes are currently in this page only. Export the JSON and replace data.json on GitHub to publish them.'}
async function loadFromGitHub(){try{document.getElementById('sourceText').textContent='Loading current data.json…';const r=await fetch('./data.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);travelData=normaliseData(await r.json());localStorage.setItem('travelMapData',JSON.stringify(travelData));renderList();updateStatusMessage();document.getElementById('sourceTitle').textContent='Data source: GitHub';document.getElementById('sourceText').textContent='Loaded the current data.json published with this site.'}catch(e){document.getElementById('sourceTitle').textContent='Could not load GitHub data';document.getElementById('sourceText').textContent=e.message}}
function saveDraft(){localStorage.setItem('travelMapData',JSON.stringify(travelData));alert('Draft saved in this browser. It does not change the public map.')}
function openJSONEditor(mode){jsonMode=mode;const editor=document.getElementById('jsonEditor');document.getElementById('jsonModal').style.display='flex';if(mode==='export'){document.getElementById('modalTitle').textContent='Export JSON';document.getElementById('modalHelp').textContent='Copy this complete JSON and replace data.json in your GitHub repository.';editor.value=JSON.stringify(travelData,null,2);editor.readOnly=true;document.getElementById('applyJSONButton').style.display='none'}else{document.getElementById('modalTitle').textContent='Import / Edit JSON';document.getElementById('modalHelp').textContent='Paste JSON here, or edit the existing data, then choose “Use This JSON”.';editor.value=JSON.stringify(travelData,null,2);editor.readOnly=false;document.getElementById('applyJSONButton').style.display='block';editor.focus()}}
async function copyJSON(){const t=document.getElementById('jsonEditor');try{await navigator.clipboard.writeText(t.value);alert('Copied to clipboard.')}catch(e){t.focus();t.select();document.execCommand('copy');alert('Copied to clipboard.')}}
function applyJSON(){try{travelData=normaliseData(JSON.parse(document.getElementById('jsonEditor').value));renderList();markDraft();closeJSONEditor();alert('JSON loaded into the Admin page. Export it when you are ready to publish it on GitHub.')}catch(e){alert('Invalid JSON: '+e.message)}}
function closeJSONEditor(){document.getElementById('jsonModal').style.display='none'}
function resetData(){if(!confirm('Reset every country to Unvisited (Grey)?'))return;initialiseDefaults();renderList();markDraft()}
function filterCountries(){const q=document.getElementById('searchInput').value.toLowerCase();document.querySelectorAll('.country-row:not(.header)').forEach(r=>r.style.display=r.dataset.name.includes(q)?'grid':'none')}
(async function init(){initialiseDefaults();renderList();updateStatusMessage();await loadFromGitHub()})();
</script>
</body>
</html>
