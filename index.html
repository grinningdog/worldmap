<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Travel Map</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap@1.7.0/dist/css/jsvectormap.min.css">
<style>
html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,sans-serif;background:#f4f7f6;color:#333}header{height:70px;box-sizing:border-box;background:#2c3e50;color:#fff;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:1.5rem}header a{color:#3498db;text-decoration:none;font-weight:bold}#map-container{width:100%;height:calc(100vh - 70px);background:#e0e7ee}.legend{position:absolute;bottom:20px;left:20px;background:#fff;padding:15px;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,.1);z-index:10}.legend-item{display:flex;align-items:center;margin-bottom:5px;font-size:.9rem}.legend-color{width:20px;height:20px;border-radius:4px;margin-right:10px;border:1px solid #ddd}#message{position:absolute;top:85px;left:50%;transform:translateX(-50%);background:#fff;padding:8px 14px;border-radius:5px;box-shadow:0 2px 5px rgba(0,0,0,.15);z-index:20;display:none}@media(max-width:768px){header{height:auto;min-height:70px;padding:.8rem 1rem;flex-direction:column;gap:.5rem;text-align:center}header h1{font-size:1.2rem}#map-container{height:calc(100vh - 100px)}.legend{bottom:10px;left:10px;right:10px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:5px}.legend-item{font-size:.75rem;margin:0}.legend-color{width:15px;height:15px;margin-right:6px}}
</style></head><body>
<header><h1>🌍 My World Travel Map</h1><a href="admin.html">Admin Panel</a></header><div style="position:relative;height:calc(100% - 70px)"><div id="map-container"></div><div id="message"></div>
<div class="legend"><div class="legend-item"><div class="legend-color" style="background:#2ECC71"></div>Visited</div><div class="legend-item"><div class="legend-color" style="background:#2980B9"></div>Priority A</div><div class="legend-item"><div class="legend-color" style="background:#3498DB"></div>Priority B</div><div class="legend-item"><div class="legend-color" style="background:#85C1E9"></div>Priority C</div><div class="legend-item"><div class="legend-color" style="background:#E74C3C"></div>Never Visit</div><div class="legend-item"><div class="legend-color" style="background:#BDC3C7"></div>Unvisited</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.7.0/dist/js/jsvectormap.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.7.0/dist/maps/world.js"></script>
<script>
const STATUS_COLORS={visited:'#2ECC71',priority_a:'#2980B9',priority_b:'#3498DB',priority_c:'#85C1E9',never:'#E74C3C',default:'#BDC3C7'};let travelData={countries:{}};
function showMessage(t){const e=document.getElementById('message');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',4000)}
function createMap(){const map=new jsVectorMap({selector:'#map-container',map:'world',backgroundColor:'transparent',regionStyle:function(code){const s=travelData.countries[code]||'default';const fill=STATUS_COLORS[s]||STATUS_COLORS.default;return{initial:{fill:fill,fillOpacity:1,stroke:'#fff',strokeWidth:.5},hover:{fill:fill,fillOpacity:.85}}}});map.on('regionTooltipShow',function(event,tooltip,code){tooltip.text(tooltip.text()+' ('+code+')')})}
async function loadData(){try{const r=await fetch('./data.json',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);travelData=await r.json();if(!travelData.countries)throw new Error('Missing countries object');createMap();console.log('Loaded data.json')}catch(err){console.error(err);const local=localStorage.getItem('travelMapData');if(local){try{travelData=JSON.parse(local);createMap();showMessage('Showing saved browser data.');return}catch(e){console.error(e)}}travelData={countries:{}};createMap();showMessage('Could not load data.json. Check that it is beside index.html.')}}loadData();
</script></body></html>
